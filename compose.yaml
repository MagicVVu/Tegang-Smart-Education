name: tegang_smart_education_c02

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tegang_smart_education}
      POSTGRES_USER: ${POSTGRES_USER:-tegang_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1 FROM pg_extension WHERE extname='vector'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - runtime

  redis:
    image: redis:7.4.10-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - runtime

  migrate:
    image: tegang-smart-education/backend:c06-0.3.0
    restart: "no"
    command:
      - python
      - -m
      - alembic
      - -c
      - backend/alembic.ini
      - upgrade
      - head
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tegang_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tegang_smart_education}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - runtime

  backend:
    image: tegang-smart-education/backend:c06-0.3.0
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-tegang-smart-education}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-tegang-clients}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-15}
      AUTH_REFRESH_TOKEN_DAYS: ${AUTH_REFRESH_TOKEN_DAYS:-7}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tegang_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tegang_smart_education}
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - runtime

  web:
    image: tegang-smart-education/web:c06-0.3.0
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_DEMO_MODE: ${DEMO_MODE:-false}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:4173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - runtime

volumes:
  postgres_data:
  redis_data:

networks:
  runtime:
    driver: bridge
