[project]
name = "tegang-smart-education-backend"
version = "0.3.0"
description = "FastAPI identity, authentication, and RBAC foundation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pwdlib[argon2]==0.3.0",
  "PyJWT==2.13.0",
  "redis==8.0.1",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.pip-tools]
generate-hashes = true
strip-extras = false
