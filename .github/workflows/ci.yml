name: repository-baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required navigation files
        shell: bash
        run: |
          test -f README.md
          test -f docs/README.md
          test -f docs/status.md
          test -f .env.example
          test -f CONTRIBUTING.md

      - name: Confirm local secrets are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "Tracked local environment file detected."
            exit 1
          fi
          echo "Repository baseline checks passed."

  prototype-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build Web prototype
        run: pnpm build:web

  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: tegang_c04_ci
          POSTGRES_USER: tegang_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tegang_ci -d tegang_c04_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://tegang_ci:ci-only-password@127.0.0.1:5432/postgres
      MIGRATION_TEST_DATABASE_URL: postgresql://tegang_ci:ci-only-password@127.0.0.1:5432/tegang_c04_ci
      REDIS_URL: redis://test.invalid:6379/0
      MODEL_PROVIDER: ci-stub
      MODEL_BASE_URL: https://model.invalid/v1
      MODEL_NAME: ci-model
      MODEL_API_KEY: ci-not-a-real-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Backend and contract tests
        run: python -m pytest backend/tests

      - name: Contract artifact drift
        run: python backend/scripts/export_contracts.py --check

      - name: Alembic reversible migration verification
        run: |
          python -m backend.scripts.verify_migrations
          ALEMBIC_DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" python -m alembic -c backend/alembic.ini check
